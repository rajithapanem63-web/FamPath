services:
  # Backend API
  - type: web
    name: fampath-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FAMPATH_APP_ENV
        value: production
      - key: FAMPATH_DB_URL
        fromDatabase:
          name: fampath-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: fampath-db
          property: connectionString
      - key: FAMPATH_SECRET_KEY
        generateValue: true
      - key: FAMPATH_CORS_ORIGINS
        value: https://fampath-frontend.onrender.com
      - key: FAMPATH_SMTP_HOST
        value: smtp.gmail.com
      - key: FAMPATH_SMTP_PORT
        value: 587
      - key: FAMPATH_SMTP_FROM_EMAIL
        value: noreply@fampath.dev
      - key: FAMPATH_SMTP_FROM_NAME
        value: FamPath
    healthCheckPath: /health

  # Frontend
  - type: web
    name: fampath-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: NODE_ENV=development npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://fampath-backend.onrender.com

databases:
  - name: fampath-db
    databaseName: fampath
    user: fampath_user
    plan: free
