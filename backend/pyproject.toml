[project]
name = "fampath-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "FamPath – AI-Enabled Family Decision-Support Platform Backend"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "TCH", "ARG"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"alembic/*" = ["N999"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "alembic/*", "app/ml/training/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
