name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  FAMPATH_APP_ENV: testing
  FAMPATH_SECRET_KEY: ci-test-secret-key-not-for-production
  FAMPATH_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  FAMPATH_REDIS_URL: redis://localhost:6379/1
  FAMPATH_LLM_PROVIDER: mock
  FAMPATH_EMBEDDING_PROVIDER: mock

jobs:
  # ── Backend: lint + type-check + test ─────────────────────────────────────
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fampath
          POSTGRES_PASSWORD: fampath
          POSTGRES_DB: fampath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (linting)
        working-directory: backend
        run: ruff check .

      - name: Black (formatting)
        working-directory: backend
        run: black --check .

      - name: Mypy (type checking)
        working-directory: backend
        run: mypy --strict app/ --ignore-missing-imports

      - name: Run tests with coverage
        working-directory: backend
        env:
          FAMPATH_DB_URL: postgresql+asyncpg://fampath:fampath@localhost:5432/fampath_test
          TEST_DB_URL: postgresql+asyncpg://fampath:fampath@localhost:5432/fampath_test
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --timeout=60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend: lint + type-check + test ───────────────────────────────────
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type-check
        working-directory: frontend
        run: npm run type-check

      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check

      - name: Vitest unit tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── i18n key parity check ─────────────────────────────────────────────────
  i18n-check:
    name: i18n key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check i18n key parity
        run: node scripts/check_i18n_keys.js

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-39 || true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=critical || true

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t fampath-backend:${{ github.sha }} backend/

      - name: Build frontend image
        run: docker build -t fampath-frontend:${{ github.sha }} frontend/
