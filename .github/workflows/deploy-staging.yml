name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Build and tag images
        run: |
          docker build -t fampath-backend:staging-${{ github.sha }} backend/
          docker build -t fampath-frontend:staging-${{ github.sha }} frontend/

      - name: Run DB migrations (staging)
        env:
          FAMPATH_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          docker run --rm \
            -e FAMPATH_DB_URL="$FAMPATH_DB_URL" \
            -e FAMPATH_SECRET_KEY="${{ secrets.STAGING_SECRET_KEY }}" \
            -e FAMPATH_ENCRYPTION_KEY="${{ secrets.STAGING_ENCRYPTION_KEY }}" \
            -e FAMPATH_REDIS_URL="${{ secrets.STAGING_REDIS_URL }}" \
            -e FAMPATH_APP_ENV=staging \
            -e FAMPATH_LLM_PROVIDER=mock \
            fampath-backend:staging-${{ github.sha }} \
            alembic upgrade head

      - name: Deploy backend to staging
        # Replace with your deployment command (ECS, fly.io, etc.)
        run: echo "Deploy backend to staging — configure your deployment target here"

      - name: Deploy frontend to staging
        run: echo "Deploy frontend to staging — configure your deployment target here"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          fail_action: false  # report only, don't fail in CI
